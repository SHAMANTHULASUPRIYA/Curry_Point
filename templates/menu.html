{% extends "base.html" %}
{% block content %}
    <h1>🍛 Welcome to Supriya's Curry Point 🍛</h1>
    <p style="color: #d84315; font-size: 18px; margin-bottom: 30px;">Delicious curries made with love, served fresh every day!</p>

    <a href="{{ url_for('cart') }}" style="display:inline-block; background:#d84315; color:#fff; padding:10px 24px; border-radius:6px; font-size:18px; margin-bottom:24px; text-decoration:none;">View Cart 🛒</a>

    <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 24px;">
        {% for item in items %}
            <div style="background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); width: 260px; margin: 10px; padding: 18px 14px 14px 14px; text-align: left; position: relative;">
                <img src="{{ url_for('static', filename='images/' ~ item[3]) }}" alt="{{ item[1] }}" style="width:100%; height:160px; object-fit:cover; border-radius:8px; margin-bottom:12px;">
                <div style="font-size: 20px; font-weight: bold; color: #333; margin-bottom: 6px;">{{ item[1] }}</div>
                <div style="font-size: 16px; color: #d84315; font-weight: 600; margin-bottom: 10px;">₹{{ item[2] }}</div>
                <form action="{{ url_for('add_to_cart', curry_id=item[0]) }}" method="post" style="margin:0;">
                    <button type="submit" style="width:100%; background:#d84315; color:#fff; border:none; border-radius:6px; padding:10px 0; font-size:16px; font-weight:600; cursor:pointer;">Add to Cart</button>
                </form>
            </div>
        {% endfor %}
    </div>
{% endblock %}
